/* --- cuotas de tarjeta --- */
function primeraCuota(mov, tj) {
  const [Y, M, D] = mov.fecha.split("-").map(Number);
  const cierre = tj && tj.cierre ? tj.cierre : 25;
  return addM(Y, M - 1, D <= cierre ? 1 : 2);
}
function cuotasDe(mov, tj) {
  const n = Math.max(1, Number(mov.cuotas) || 1);
  const p = primeraCuota(mov, tj);
  const valor = Number(mov.monto) / n;
  const arr = [];
  for (let i = 0; i < n; i++) {
    const d = addM(p.y, p.m, i);
    arr.push({
      y: d.y,
      m: d.m,
      i,
      monto: valor
    });
  }
  return arr;
}
function itemsDelMes(db, y, m) {
  const key = mIdx(y, m);
  const out = [];
  for (const mv of db.movs) {
    const [Y, M, D] = mv.fecha.split("-").map(Number);
    const start = mIdx(Y, M - 1);
    if (mv.medio === "tarjeta") {
      const tj = db.tarjetas.find(t => t.id === mv.tarjetaId);
      for (const c of cuotasDe(mv, tj)) {
        if (mIdx(c.y, c.m) === key) {
          out.push({
            ...mv,
            _id: mv.id + "-" + c.i,
            _monto: c.monto,
            _cuota: `${c.i + 1}/${Math.max(1, mv.cuotas || 1)}`,
            _fecha: mv.fecha,
            _dia: D
          });
        }
      }
    } else if (mv.recurrente) {
      if (key >= start) out.push({
        ...mv,
        _id: mv.id + "-" + key,
        _monto: mv.monto,
        _fecha: `${y}-${pad(m + 1)}-${pad(D)}`,
        _dia: D,
        _rec: true
      });
    } else if (key === start) {
      out.push({
        ...mv,
        _id: mv.id,
        _monto: mv.monto,
        _fecha: mv.fecha,
        _dia: D
      });
    }
  }
  return out.sort((a, b) => b._dia - a._dia);
}
function cuotasPendientes(db, desdeKey) {
  const res = [];
  for (const mv of db.movs) {

    const tj = db.tarjetas.find(t => t.id === mv.tarjetaId);
    for (const c of cuotasDe(mv, tj)) if (mIdx(c.y, c.m) >= desdeKey) res.push({
      mov: mv,
      ...c
    });
  }
  return res;
}

/* --- inversiones --- */
function calcInv(inv, hastaStr) {
  const hasta = hastaStr || hoyStr();
  const capital = Number(inv.monto) || 0;
  const tna = Number(inv.tna) || 0;
  const dias = Math.max(0, diasEntre(inv.fecha, hasta));
  const diasTope = inv.vence ? Math.min(dias, Math.max(0, diasEntre(inv.fecha, inv.vence))) : dias;
  const anual = capital * (tna / 100);
  const mensual = anual / 12;
  const diario = anual / 365;
  const ganado = diario * diasTope;
  const valor = capital + ganado;
  const restan = inv.vence ? diasEntre(hasta, inv.vence) : null;
  const plazoTotal = inv.vence ? Math.max(1, diasEntre(inv.fecha, inv.vence)) : null;
  const avance = plazoTotal ? Math.min(100, diasTope / plazoTotal * 100) : null;
  const alVencer = plazoTotal ? capital + diario * plazoTotal : null;
  return {
    capital,
    tna,
    dias: diasTope,
    anual,
    mensual,
    diario,
    ganado,
    valor,
    restan,
    avance,
    alVencer
  };
}

    mejor: 0,
    ultimo: null,

  if (j.ultimo === hoy) return j;
  const ayer = new Date();
  ayer.setDate(ayer.getDate() - 1);
  const ayerStr = `${ayer.getFullYear()}-${pad(ayer.getMonth() + 1)}-${pad(ayer.getDate())}`;
  j.dias = j.ultimo === ayerStr ? (j.dias || 0) + 1 : 1;
  j.ultimo = hoy;
  j.mejor = Math.max(j.mejor || 0, j.dias);
  return j;
}

function App() {
  const [db, setDb] = useState(null);
  const [tab, setTab] = useState("inicio");
  const hoy = new Date();
  const [cur, setCur] = useState({
    y: hoy.getFullYear(),
    m: hoy.getMonth()
  });
  const [form, setForm] = useState(null);
  const [detalle, setDetalle] = useState(null);
  const [ajustes, setAjustes] = useState(false);
  const [festejo, setFestejo] = useState(null);
  const listo = useRef(false);
  const logrosPrev = useRef([]);
  useEffect(() => {
    const d = cargar();
    setDb(d);
    logrosPrev.current = LOGROS.filter(l => l.test(d)).map(l => l.id);
    listo.current = true;
  }, []);
  useEffect(() => {
    if (db && listo.current) {
      guardar(db);
      const ahora = LOGROS.filter(l => l.test(db));
      const nuevo = ahora.find(l => !logrosPrev.current.includes(l.id));
      if (nuevo) setFestejo(nuevo);
      logrosPrev.current = ahora.map(l => l.id);
    }
  }, [db]);
  const keyActual = mIdx(hoy.getFullYear(), hoy.getMonth());
  const keyCur = mIdx(cur.y, cur.m);
  const items = useMemo(() => db ? itemsDelMes(db, cur.y, cur.m) : [], [db, cur]);
  const totales = useMemo(() => {
    let ing = 0,
      gas = 0,
      tarj = 0;
    for (const it of items) {
      if (it.tipo === "ingreso") ing += it._monto;else {
        gas += it._monto;
        if (it.medio === "tarjeta") tarj += it._monto;
      }
    }
    return {
      ing,
      gas,
      tarj,
      saldo: ing - gas
    };
